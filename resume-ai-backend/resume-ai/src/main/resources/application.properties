spring.application.name=resume-ai

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/resume_ai_db
spring.datasource.username=root
spring.datasource.password=venu1234

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Resume upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Google Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini model configuration
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.3


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000